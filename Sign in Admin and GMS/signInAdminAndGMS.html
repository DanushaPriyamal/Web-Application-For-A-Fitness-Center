<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitZone Fitness Center | Admin And GMS Sign In</title>

    <link rel="stylesheet" href="siaag_stylesheet.css">
</head>

<body>
    <div class="main-tag">
        <h1>FitZone</h1>
        <h1>Fitness</h1>
        <h1>Center</h1>
    </div>

    <div class="login-container">

        <h2>Admin And GMS </h2>
        <h2> Sign In</h2>

        <form id="adminAndGMSSignInForm">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Sign In</button>
        </form>
    </div>

    <script src="signInAdminAndGMSBehavior.js"></script>

</body>

</html>
